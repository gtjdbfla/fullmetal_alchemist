services:
  east-project:
    image: caddy:2-alpine
    container_name: east-project
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/data/project.json"]
      interval: 30s
      timeout: 5s
      retries: 3
